name: IvyBridge CUDA Build

on:
  push:
    branches:
      - ivybridge-b10926
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 - Ivy Bridge + CUDA 12.4
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CUDA
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Enable Ivy Bridge variant
        shell: pwsh
        run: |
          $path = "ggml/src/CMakeLists.txt"
          $text = Get-Content $path -Raw

          if ($text -notmatch 'ggml_add_cpu_backend_variant\(sandybridge\s+SSE42 AVX\)') {
              throw "FAIL: Could not find x86 CPU variant section."
          }

          if ($text -notmatch 'ggml_add_cpu_backend_variant\(ivybridge\s+SSE42 AVX F16C\)') {
              throw "FAIL: Expected upstream Ivy Bridge block was not found."
          }

          $pattern = 'ggml_add_cpu_backend_variant\(sandybridge\s+SSE42 AVX\)\r?\n\s+if \(NOT MSVC\)\r?\n\s+# __FMA__ and __F16C__ are not defined in MSVC, however they are implied with AVX2/AVX512\r?\n\s+ggml_add_cpu_backend_variant\(ivybridge\s+SSE42 AVX F16C\)'

          $replacement = @(
              '    ggml_add_cpu_backend_variant(sandybridge        SSE42 AVX)'
              '    ggml_add_cpu_backend_variant(ivybridge          SSE42 AVX)'
              '    if (NOT MSVC)'
              '        # __FMA__ and __F16C__ are not defined in MSVC, however they are implied with AVX2/AVX512'
              '        ggml_add_cpu_backend_variant(ivybridge-f16c SSE42 AVX F16C)'
          ) -join "`r`n"

          $newText = [regex]::Replace($text, $pattern, $replacement, 1)

          if ($newText -eq $text) {
              throw "FAIL: CMake variant replacement did not occur."
          }

          Set-Content -Path $path -Value $newText -NoNewline

          Write-Host "PASS: Ivy Bridge SSE4.2 + AVX variant enabled for MSVC."

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_BACKEND_DL=ON -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DGGML_CPU=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_BMI2=OFF -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86 -DLLAMA_BUILD_BORINGSSL=ON

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          where cl
          echo INCLUDE=%INCLUDE%
          echo LIB=%LIB%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Verify Ivy Bridge compiler flags
        shell: pwsh
        run: |
          $commands = ninja -C build -f build-Release.ninja -t commands 2>&1
          $matches = $commands | Select-String "ggml-cpu-ivybridge"

          if (-not $matches) {
              throw "FAIL: Could not find ggml-cpu-ivybridge compile commands."
          }

          Write-Host "Ivy Bridge compile commands:"
          $matches | ForEach-Object {
              Write-Host $_.Line
          }

          $text = ($matches | ForEach-Object {
              $_.Line
          }) -join "`n"

          if ($text -notmatch "/arch:AVX") {
              throw "FAIL: Ivy Bridge backend is missing /arch:AVX."
          }

          if ($text -match "/arch:AVX2") {
              throw "FAIL: Ivy Bridge backend incorrectly contains /arch:AVX2."
          }

          if ($text -match "/arch:AVX512") {
              throw "FAIL: Ivy Bridge backend incorrectly contains /arch:AVX512."
          }

          Write-Host "PASS: Ivy Bridge backend uses AVX without AVX2/AVX512."

      - name: Verify Ivy Bridge configuration
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse build -Include *.ninja,*.cmake -File
          $text = ($files | ForEach-Object {
              Get-Content $_.FullName -Raw
          }) -join "`n"

          if ($text -notmatch 'ggml-cpu-ivybridge') {
              throw "FAIL: ggml-cpu-ivybridge target was not generated."
          }

          Write-Host "PASS: ggml-cpu-ivybridge target was generated."
          Write-Host "AVX2/AVX512 checks skipped because GGML_CPU_ALL_VARIANTS=ON."

      - name: Verify Ivy Bridge backend
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Recurse build -Filter "ggml-cpu-ivybridge.dll" -File

          if (-not $dlls) {
              throw "FAIL: ggml-cpu-ivybridge.dll was not produced."
          }

          Write-Host "PASS: Dedicated Ivy Bridge backend found:"
          $dlls | ForEach-Object {
              Write-Host $_.FullName
          }

      - name: List CPU backends
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Recurse build -Filter "ggml-cpu*.dll" -File

          if (-not $dlls) {
              throw "FAIL: No CPU backend DLLs were found."
          }

          Write-Host "CPU backend DLLs:"
          $dlls | ForEach-Object {
              Write-Host $_.FullName
          }

      - name: Package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item -Recurse build/bin/Release/* artifact/

          Write-Host "Packaged files:"
          Get-ChildItem -Recurse artifact -File | ForEach-Object {
              Write-Host $_.FullName
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-IvyBridge-b10926-ivybackend-cuda12.4
          path: artifact/*
          if-no-files-found: error
